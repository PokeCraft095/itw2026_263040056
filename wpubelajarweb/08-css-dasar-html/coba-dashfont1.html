<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try CSS - Font Styling</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Jaro:opsz@6..72&family=Zhi+Mang+Xing&display=swap');
        h1 {
            color: crimson;
            font-size: 60px;
            text-align: center;
            font-family: "Bungee", sans-serif;
        }

        h3 {
            color: crimson;
            font-size: 30px;
            text-align: center;
            font-family: "Jaro";
        }

        p {
            color: crimson;
            font-size: 60px;
            text-align: center;
            font-family: "Zhi Mang Xing";
            font-weight: 300;
        }
    </style>
</head>
<body>
    <h1>Long Live Loji</h1>
    <h3>Imagine if Loji really exist in People's Overlordship over Asia :D</h3>
    <p>罗几很漂亮，我们爱罗几</p>
</body>
</html>
