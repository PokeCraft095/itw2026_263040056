<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&family=VT323&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        h1 {
            font-family: 'Jaro', sans-serif;
            font-size: 2.5rem;
            color: #333;
        }
        p {
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>The Art of Coding</h1>
    <p>Coding is an art form that combines logic and creativity to build amazing digital experiences.</p>
    <p>This is another paragraph to demonstrate typography.</p>
</body>
</html>
