<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Backgrounds</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #333;
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 5px solid #fff;
            margin: auto;
            background-image: url('img/ABEEE.png'), url('img/mayora.png'), url('img/bali.png');
            background-size: 470px;
            background-repeat: no-repeat;
            background-position: center bottom, bottom left;
            background-color: #1E293B;
        }

        h1 {
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 40px;
            text-shadow: 2px 2px 4px #000;
        }
    </style>
</head>
<body>
    <h1>My Profile Ka-ado</h1>
    <div class="frame"></div>
</body>
</html>
