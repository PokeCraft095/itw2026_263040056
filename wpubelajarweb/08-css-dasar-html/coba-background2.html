<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try Background</title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(to right, lightgreen, lightblue);
            height: 100vh;
        }

        .square1 {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: linear-gradient(to bottom, yellow, red);
        }
        .square2 {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: radial-gradient(circle, yellow, red);
        }
        .square3 {
            width: 200px;
            height: 200px;
            background-color: red;
            background-image: conic-gradient(from 0deg, yellow, red);
        }
    </style>
</head>
<body>
    <div class="square1"></div>
    <div class="square2"></div>
    <div class="square3"></div>
</body>
</html>
