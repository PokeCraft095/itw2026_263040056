<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFR Quotes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #f8f8ff;
            text-align: center;
            background-color: #0F172A;
            background-image: linear-gradient(to bottom, rgba(19, 51, 128, 60%), rgba(165, 14, 14, 0.6)), url('https://static.wikitide.net/thefireriseswikiwiki/4/45/Super_invasion_of_taiwan.png?_=20250502160726');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }
        h1 {
            font-size: 4em;
            text-transform: uppercase;
            font-style: italic;
            /*text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);*/
            background-image: linear-gradient(to right, rgb(32, 32, 233), rgb(179, 36, 179), rgb(165, 8, 39));
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 0px 10px rgba(128, 8, 8, 0.5));
        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
            background-color: rgb(255 255 255 / 10%);
            max-width: 750px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgb(255 255 255 / 20%);
            box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
        }

        span {
            color: rgb(255, 255, 255);
            text-shadow: 0 0 10px rgb(252, 54, 54);
        }

        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(151, 151, 151);
            font-weight: normal;
            text-transform: uppercase;
            border-top: 2px solid rgb(255 255 255 / 20%); width: 750px;
            margin: 20px auto 0;
        }
    </style>
</head>
<body>
    <h1>TFR Quotes - The Invasion of Taiwan</h1>
    <p class="quote">"You must all be aware that <span>modern war</span> is not a mere matter of military operations. It involves the <span>whole strength</span> and all the <span>resources of the nation.</span>"</p>
    <p class="credit">- Chiang Kai-Shek</p>
</body>
</html>
