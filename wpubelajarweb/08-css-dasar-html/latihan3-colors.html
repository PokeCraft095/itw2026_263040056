<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFR Quotes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #f8f8ff;
            text-align: center;
            background-color: #0F172A;
        }
        h1 {
            font-size: 48px;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 10px;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: #374460;
            text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
            color: #38BAF4;
        }

        .quote {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span {
            color: rgb(202, 6, 6);
            text-decoration: line-through;            
        }

        .credit {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgb(151, 151, 151);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>TFR Quotes</h1>
    <p class="quote">"You must all be aware that <span>modern war</span> is not a mere matter of military operations. It involves the whole strength and all the resources of the nation."</p>
    <p class="creditor">- Chiang Kai-Shek</p>
</body>
</html>
