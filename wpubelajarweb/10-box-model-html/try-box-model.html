<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trying Box Model</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .box1 {
            width: 300px;
            height: 300px;
            background-color: rgb(183, 187, 187);
            /*margin-top: 20px;
            margin-right: 0px;
            margin-bottom: 40px;
            margin-left: 20px;
            margin: 50px auto 100px;*/
            margin: 10px 20px 30px 40px;
            padding: 50px;

            border-right: 10px solid rgb(86, 86, 90);
            border-bottom: 10px solid rgb(86, 86, 90);
        }

        .box2 {
            width: 300px;
            height: 150px;
            background-color: rgb(255, 72, 0);
            margin-top: -50px;
        }
    </style>
</head>
<body>
    <div class="box1">1</div>
    <div class="box2">2</div>
</body>
</html>
