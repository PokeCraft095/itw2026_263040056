<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers Card</title>
</head>
<body>
    <article class="product-card">
        <figure class="product-image">
            <img src="https://images.unsplash.com/photo-1593287073863-c992914cb3e3?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3Dq=80&w=600&auto=format&fit=crop" alt="sneakers adidas black">
        </figure>

        <p class="product-category">Adidas Sneakers</p>
        <h3 class="product-title">Aura Max Essentials</h3>

        <p class="product-description">Adidas Aura Max Essentials is the most confortable and coolest sneakers in the world! This bad boy can make you gain 1 Million Aura frfr</p>

        <div class="price-section">
            <span class="price">IDR 1.899.000</span>
            <del class="original-price">IDR 2.999.000</del>
        </div>
        
        <form action="">
            <fieldset class="size-optio-wrapper">
                <legend class="size-label-text">Choose Size (USA):</legend>
                <div class="size-options">
                    <input type="radio" name="size" id="s8" value="8">
                    <label for="s8">8</label>

                    <input type="radio" name="size" id="s9" value="9">
                    <label for="s9">9</label>

                    <input type="radio" name="size" id="s10" value="10">
                    <label for="s10">10</label>

                    <input type="radio" name="size" id="s11" value="11">
                    <label for="s11">11</label>

                    <input type="radio" name="size" id="s12" value="12">
                    <label for="s12">12</label>
                </div>
            </fieldset>

            <button class="buy-button" type="">Add to Shopping Cart</button>
        </form>
    </article>
</body>
</html>
