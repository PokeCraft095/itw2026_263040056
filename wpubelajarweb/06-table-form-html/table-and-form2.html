<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Table Testing</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Name 1</th>
                <th>Name 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th>Number 1</th>
                <td>Row 1, Column 1</td>
                <td>Row 1, Column 2</td>
            </tr>
            <tr>
                <th>Number 2</th>
                <td>Row 2, Column 1</td>
                <td>Row 2, Column 2</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
